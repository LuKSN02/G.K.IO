<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>G.K.IO</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/favicon-512.png">
<script>
// Aplica o tema salvo de forma síncrona, antes do primeiro paint,
// para evitar o "flash" de tema claro/cor padrão. A lógica completa
// (com reatividade) vive em js/theme.js.
(function () {
  try {
    var raw = localStorage.getItem('gkio-theme-prefs');
    var prefs = raw ? JSON.parse(raw) : {};
    var mode = prefs.mode || 'light';
    if (mode === 'auto') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', mode);
    var accents = {
      cosmic: { a: '#5B6EE8', s: '#4453C4', so: 'rgba(91,110,232,0.12)', g: 'rgba(91,110,232,0.25)' },
      teal: { a: '#1F6F78', s: '#16545C', so: 'rgba(31,111,120,0.12)', g: 'rgba(31,111,120,0.25)' },
      indigo: { a: '#4C5FD5', s: '#3945A8', so: 'rgba(76,95,213,0.12)', g: 'rgba(76,95,213,0.25)' },
      rose: { a: '#C24868', s: '#9C3550', so: 'rgba(194,72,104,0.12)', g: 'rgba(194,72,104,0.25)' },
      amber: { a: '#B9812E', s: '#8F6221', so: 'rgba(185,129,46,0.12)', g: 'rgba(185,129,46,0.25)' },
      emerald: { a: '#22916A', s: '#186F51', so: 'rgba(34,145,106,0.12)', g: 'rgba(34,145,106,0.25)' },
      violet: { a: '#7C4FC2', s: '#5F3A98', so: 'rgba(124,79,194,0.12)', g: 'rgba(124,79,194,0.25)' },
      obsidian: { a: '#1C2733', s: '#0F161D', so: 'rgba(28,39,51,0.14)', g: 'rgba(28,39,51,0.3)' },
      aurora: { a: '#1FA7C9', s: '#146E85', so: 'rgba(31,167,201,0.14)', g: 'rgba(31,167,201,0.3)' },
    };
    // "cosmic" (derivado do ícone do app) é o accent padrão agora.
    var acc = accents[prefs.accent] || accents.cosmic;
    var root = document.documentElement.style;
    root.setProperty('--gk-accent', acc.a);
    root.setProperty('--gk-accent-strong', acc.s);
    root.setProperty('--gk-accent-soft', acc.so);
    root.setProperty('--gk-accent-glow', acc.g);
  } catch (e) { /* localStorage indisponível — segue com o tema padrão */ }
})();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ======================= AUTENTICAÇÃO ======================= -->
<div id="gk-auth">
  <div class="gk-auth-card">
    <div class="gk-auth-logo">
      <div class="gk-mark">GK</div>
      <div class="gk-wordmark">G.K<span>.IO</span></div>
    </div>
    <h2 id="gk-auth-title">Entrar no G.K.IO</h2>
    <p class="gk-modal-sub" id="gk-auth-sub">Bem-vindo de volta.</p>
    <form id="gk-auth-form">
      <div class="gk-field" id="gk-auth-username-field" style="display:none;">
        <label>Nome de usuário</label>
        <input type="text" id="gk-auth-username" autocomplete="username" placeholder="seu-nome">
      </div>
      <div class="gk-field">
        <label>E-mail</label>
        <input type="email" id="gk-auth-email" autocomplete="email" required placeholder="voce@email.com">
      </div>
      <div class="gk-field">
        <label>Senha</label>
        <input type="password" id="gk-auth-password" autocomplete="current-password" required placeholder="••••••••">
        <div class="gk-error" id="gk-auth-error"></div>
      </div>
      <button type="submit" class="gk-btn gk-btn-primary gk-btn-block" id="gk-auth-submit">Entrar</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--gk-gray-500);cursor:pointer;" id="gk-auth-mode-toggle">Não tem conta? Criar conta</p>
  </div>
</div>

<!-- ======================= APP SHELL ======================= -->
<div id="gk-app">

  <!-- Painel de navegação (rail de servidores + sidebar) — em telas
       de smartphone vira uma gaveta deslizante, aberta pelo botão
       de menu (☰) no topbar. -->
  <div class="gk-nav-drawer" id="gk-nav-drawer">

  <!-- Rail de servidores -->
  <div class="gk-rail">
    <div class="gk-rail-item gk-active" id="gk-dm-rail-item" title="Mensagens diretas">
      <div class="gk-rail-pill"></div>
      <span class="gk-rail-item-badge" id="gk-dm-rail-badge"></span>
      <img src="img/logo.png" alt="G.K.IO">
    </div>
    <div class="gk-rail-divider"></div>
    <div id="gk-rail-servers"></div>
    <div class="gk-server-menu-wrap">
      <div class="gk-rail-item gk-add" id="gk-add-server-btn" title="Adicionar servidor">+</div>
      <div class="gk-server-menu" id="gk-server-menu">
        <button id="gk-create-server-btn"><span data-icon="plus" class="gk-inline-icon"></span> Criar servidor</button>
        <button id="gk-join-server-btn"><span data-icon="key" class="gk-inline-icon"></span> Entrar com convite</button>
      </div>
    </div>
  </div>

  <!-- Sidebar (canais ou DMs) -->
  <div class="gk-sidebar">
    <div class="gk-sidebar-header">
      <span id="gk-sidebar-header-title">Mensagens diretas</span>
      <div style="display:flex;gap:2px;">
        <button id="gk-add-friend-btn" title="Adicionar amigo" data-icon="personPlus"></button>
        <button id="gk-server-settings-btn" title="Configurações do servidor" style="display:none;" data-icon="settings"></button>
      </div>
    </div>
    <div class="gk-sidebar-body" id="gk-sidebar-body"></div>
    <div class="gk-mini-profile" id="gk-mini-profile">
      <div class="gk-avatar gk-sz-32" id="gk-mini-avatar-wrap" data-status="online">
        <img id="gk-mini-avatar" src="">
      </div>
      <div class="gk-mini-info">
        <div class="gk-name" id="gk-mini-name">—</div>
        <div class="gk-status-text" id="gk-mini-status">—</div>
      </div>
      <div class="gk-mini-actions">
        <button id="gk-status-online" class="gk-status-dot-btn gk-status-dot-online" title="Online" data-icon="dot"></button>
        <button id="gk-status-idle" class="gk-status-dot-btn gk-status-dot-idle" title="Ausente" data-icon="dot"></button>
        <button id="gk-status-dnd" class="gk-status-dot-btn gk-status-dot-dnd" title="Não perturbe" data-icon="dot"></button>
        <button id="gk-settings-btn" title="Configurações" data-icon="settings"></button>
        <button id="gk-logout-btn" title="Sair" data-icon="power"></button>
      </div>
    </div>
  </div>

  </div>
  <!-- Fundo escurecido atrás das gavetas móveis (nav e membros) -->
  <div class="gk-mobile-backdrop" id="gk-mobile-backdrop"></div>

  <!-- Área principal de chat -->
  <div class="gk-main">
    <div class="gk-topbar">
      <button class="gk-icon-btn gk-mobile-menu-btn" id="gk-mobile-menu-btn" title="Menu" style="display:none;" data-icon="menu"></button>
      <span class="gk-title" id="gk-topbar-title">Selecione uma conversa</span>
      <span class="gk-subtitle" id="gk-topbar-subtitle"></span>
      <div class="gk-spacer"></div>
      <button class="gk-icon-btn" id="gk-call-btn" title="Chamada de voz" style="display:none;" data-icon="phoneCall"></button>
      <button class="gk-icon-btn" id="gk-video-call-btn" title="Chamada de vídeo" style="display:none;" data-icon="videoCall"></button>
      <button class="gk-icon-btn gk-members-toggle-btn" id="gk-members-toggle-btn" title="Membros" style="display:none;" data-icon="members"></button>
    </div>
    <div class="gk-messages" id="gk-messages"></div>

    <!-- ======================= TELA "AMIGOS" (home das DMs) =======================
         Exibida em vez do chat quando nenhuma conversa está selecionada — ver
         showFriendsHome()/hideFriendsHome() em js/dms.js. Estilo Discord: lista
         de amigos e pedidos de amizade centralizados, com abas + botão de
         adicionar amigo. -->
    <div class="gk-friends-home" id="gk-friends-home" style="display:none;">
      <div class="gk-friends-home-inner">
        <div class="gk-friends-home-header">
          <div class="gk-friends-home-tabs">
            <button class="gk-friends-tab gk-active" id="gk-friends-tab-friends" data-tab="friends">Amigos</button>
            <button class="gk-friends-tab" id="gk-friends-tab-pending" data-tab="pending">
              Pedidos
              <span class="gk-friends-pending-badge" id="gk-friends-pending-badge" style="display:none;">0</span>
            </button>
          </div>
          <button class="gk-btn gk-btn-primary" id="gk-friends-add-btn">+ Adicionar amigo</button>
        </div>
        <div class="gk-friends-home-list" id="gk-friends-home-list"></div>
      </div>
    </div>

    <div class="gk-composer" id="gk-composer">
      <div class="gk-composer-box">
        <button id="gk-attach-btn" title="Anexar mídia" data-icon="attach"></button>
        <input type="file" id="gk-file-input" style="display:none;">
        <textarea id="gk-composer-input" rows="1" placeholder="Escreva uma mensagem..." enterkeyhint="send"></textarea>
        <button id="gk-emoji-btn" title="Emojis, emojis personalizados e GIFs" data-icon="emojiSmile"></button>
        <button class="gk-send" id="gk-send-btn" title="Enviar" data-icon="send"></button>
      </div>
    </div>
  </div>

  <!-- Painel de membros -->
  <div class="gk-members" id="gk-members" style="display:none;"></div>
</div>

<!-- ======================= SPLASH DE INICIALIZAÇÃO ======================= -->
<!-- Exibida só quando o Firebase restaura a sessão automaticamente
     (a pessoa já tinha feito cadastro + primeiro login antes) — ver
     js/auth.js + js/splash.js. -->
<div class="gk-splash" id="gk-splash">
  <div class="gk-splash-rings">
    <div class="gk-splash-ring gk-ring-1"></div>
    <div class="gk-splash-ring gk-ring-2"></div>
    <div class="gk-splash-ring gk-ring-3"></div>
    <div class="gk-splash-mark">GK</div>
  </div>
  <div class="gk-splash-wordmark">G.K<span>.IO</span></div>
  <div class="gk-splash-bar"><div class="gk-splash-bar-fill"></div></div>
</div>

<!-- ======================= MODAL GENÉRICO ======================= -->
<div class="gk-overlay" id="gk-generic-modal-overlay">
  <div class="gk-modal" id="gk-generic-modal"></div>
</div>

<!-- ======================= CONFIGURAÇÕES ======================= -->
<div class="gk-overlay" id="gk-settings-overlay">
  <div class="gk-settings-shell" id="gk-settings-shell">
    <div class="gk-settings-nav" id="gk-settings-nav"></div>
    <div class="gk-settings-content" id="gk-settings-content"></div>
    <button class="gk-settings-close" id="gk-settings-close" title="Fechar" data-icon="close"></button>
  </div>
</div>

<!-- ======================= CONFIGURAÇÕES DE SERVIDOR ======================= -->
<div class="gk-overlay" id="gk-server-settings-overlay">
  <div class="gk-settings-shell" id="gk-server-settings-shell">
    <div class="gk-settings-nav" id="gk-server-settings-nav"></div>
    <div class="gk-settings-content" id="gk-server-settings-content"></div>
    <button class="gk-settings-close" id="gk-server-settings-close" title="Fechar" data-icon="close"></button>
  </div>
</div>

<!-- ======================= CHAMADA — TELA CHEIA (DM, estilo Discord/Skype) ======================= -->
<div class="gk-call-screen" id="gk-call-screen">
  <div class="gk-call-screen-bg" id="gk-call-screen-bg"></div>

  <div class="gk-call-screen-top">
    <span class="gk-call-screen-status" id="gk-call-screen-status">Chamando...</span>
    <button class="gk-call-minimize-btn" id="gk-call-minimize-btn" title="Minimizar chamada" data-icon="chevronDown"></button>
  </div>

  <!-- Modo áudio: avatar grande com anéis pulsantes, como a tela de "chamando/tocando" do Skype -->
  <div class="gk-call-audio-view" id="gk-call-audio-view">
    <div class="gk-call-avatar-rings">
      <div class="gk-call-avatar-ring gk-ring-1"></div>
      <div class="gk-call-avatar-ring gk-ring-2"></div>
      <div class="gk-call-avatar-ring gk-ring-3"></div>
      <img class="gk-call-avatar-img" id="gk-call-avatar-img" src="" alt="">
    </div>
    <div class="gk-call-peer-name" id="gk-call-peer-name">—</div>
    <div class="gk-call-peer-sub" id="gk-call-peer-sub">Chamando...</div>
  </div>

  <!-- Modo vídeo: grade de vídeos remotos + miniatura da própria câmera -->
  <div class="gk-call-video-grid" id="gk-call-video-grid"></div>

  <!-- Modo grid: canal de voz de servidor — um "quadradinho" por participante
       (avatar ou câmera), com destaque para quem está falando, estilo Discord. -->
  <div class="gk-call-participants-grid" id="gk-call-participants-grid"></div>

  <div class="gk-call-self-pip" id="gk-call-self-pip" style="display:none;">
    <video id="gk-call-self-video" autoplay muted playsinline></video>
  </div>

  <div class="gk-call-controls" id="gk-call-controls">
    <button class="gk-call-ctrl-btn" id="gk-call-mute-btn" title="Mutar/desmutar" data-icon="mic"></button>
    <button class="gk-call-ctrl-btn" id="gk-call-camera-btn" title="Ativar câmera" data-icon="camera"></button>
    <button class="gk-call-ctrl-btn" id="gk-call-screenshare-btn" title="Compartilhar tela" data-icon="screenShare"></button>
    <button class="gk-call-ctrl-btn gk-call-hangup-btn" id="gk-call-hangup-btn" title="Encerrar chamada" data-icon="phoneEnd"></button>
  </div>
</div>

<!-- Barra minimizada — chamada em segundo plano (DM minimizada ou canal de voz de servidor) -->
<div class="gk-call-bar" id="gk-call-bar">
  <span class="gk-call-label" id="gk-call-bar-label">Em chamada</span>
  <button id="gk-call-bar-expand-btn" title="Expandir chamada" style="display:none;" data-icon="expand"></button>
  <button id="gk-call-bar-mute-btn" title="Mutar/desmutar" data-icon="mic"></button>
  <button id="gk-call-bar-screenshare-btn" title="Compartilhar tela" data-icon="screenShare"></button>
  <button class="gk-hangup" id="gk-call-bar-hangup-btn" title="Encerrar" data-icon="phoneEnd"></button>
</div>
<div class="gk-screenshare-grid" id="gk-screenshare-grid"></div>

<!-- Chamada recebida — cartão "tocando", estilo Discord/Skype -->
<div class="gk-incoming-call-overlay" id="gk-incoming-call-overlay">
  <div class="gk-incoming-call-card" id="gk-incoming-call-card"></div>
</div>

<!-- ======================= TOASTS ======================= -->
<div id="gk-toast-stack"></div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/apply-static-icons.js"></script>
</body>
</html>
